server {
    listen 443 ssl;
    server_name web.lab.com;

    ssl_certificate /etc/ssl/certs/web.crt;
    ssl_certificate_key /etc/ssl/private/web.key;
    ssl_client_certificate /etc/ssl/certs/ca.pem;
    ssl_verify_client off;

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
    }
}
